<form [formGroup]="form" class="flex flex-row gap-x-4 mobile-wrap">
    <div class="flex flex-row gap-x-4 mobile-wrap">
        <mat-form-field appearance="fill">
            <mat-label>{{ 'COMMON.CHOOSE_DATE_RANGE' | translate }}</mat-label>

            <mat-date-range-input [rangePicker]="picker">
                <input matStartDate formControlName="from" placeholder="Start date">
                <input matEndDate formControlName="to" placeholder="End date">
            </mat-date-range-input>

            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>
        <div class="flex flex-row mt-2 gap-x-2">
            <button (click)="resetDateRange()" [disabled]="form.invalid || form.pristine"
                    color="primary" mat-flat-button> {{ 'COMMON.BTN_CLEAR' | translate }}
            </button>
        </div>
    </div>
</form>
